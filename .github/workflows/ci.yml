name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The gate that matters: the official linter for the pinned GenVM runner, plus
  # the storage-semantics invariants the contract's correctness rests on.
  check:
    name: lint and direct-mode tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: genvm-lint (Fideicommis)
        run: genvm-lint check contracts/fideicommis.py

      - name: no floats in consensus
        run: python -m pytest tests/test_no_float.py -v

      - name: full direct-mode suite
        run: python -m pytest -v

      - name: studionet drivers parse
        run: for f in scripts/*.cjs; do node --check "$f"; done

  # The contract is the submission. The reader is checked too, but on its own
  # terms: it typechecks, builds, and refuses to leak chain code into a client
  # bundle. It is not run against a live node here, because a CI runner sharing
  # an IP would spend the public node's 30-reads-a-minute budget and every other
  # job would be throttled by its presence.
  reader:
    name: audit reader
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          # The repo is an npm workspace, so there is exactly one lockfile and it
          # lives at the root. Caching web/package-lock.json here silently fell
          # back to no cache the moment the workspace was introduced, and the
          # install ran un-cached rather than failing, which is the worse outcome.
          cache-dependency-path: package-lock.json

      # Install from the root, not from web/. Running npm ci inside a workspace
      # member installs only that member's own dependencies and skips the
      # hoisting that makes `next run build` work from here.
      - run: npm ci

      - name: typecheck
        run: npm run typecheck
        working-directory: web

      - name: build
        run: npm run build
        working-directory: web
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      # Both checks read from web/. They are the last two steps on purpose: the
      # bundle check is only meaningful once a build has produced .next.
      - name: the chain reader must not reach a client bundle
        working-directory: web
        run: |
          if grep -rlE "gen_call|createClient|genlayer-js" .next/static/chunks 2>/dev/null; then
            echo "::error::GenLayer client code found in a client bundle"
            exit 1
          fi
          echo "ok: no chain client code in any client chunk"

      - name: no key material in the app
        working-directory: web
        run: |
          # The wallet module legitimately talks about keys it does not hold, so
          # the rule is narrower than a bare grep: nothing may read key material
          # into the process. A hardcoded 64-hex literal is the thing to catch.
          if grep -rnE "0x[0-9a-fA-F]{64}" src/ --include="*.ts" --include="*.tsx"; then
            echo "::error::a 32-byte hex literal in the reader source could be key material"
            exit 1
          fi
          echo "ok: no 32-byte literal in the reader source"

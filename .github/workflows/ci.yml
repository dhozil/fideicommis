name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The gate that matters: the official linter for the pinned GenVM runner, plus
  # the storage-semantics invariants the contract's correctness rests on.
  check:
    name: lint and direct-mode tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # The direct-mode harness downloads the GenVM runner before its first test:
      # gltest/direct/sdk_loader.py resolves the latest release with a HEAD request and
      # then fetches genvm-universal.tar.xz, 128.6 MB, from which it extracts the one
      # runner this contract pins. That is a cold-start cost with no bearing on the code,
      # and the first push to this repository failed 93 tests with HTTP 404 — every
      # failure that download, not the contract. The suite mocks every model call, so
      # this is the only network read it makes.
      #
      # It is cached rather than skipped so a green run means the suite passed, not that
      # a step was made to pass. The key is the tarball, since caching extracted runners
      # would save the xz but not the fetch, which is the part that 404s.
      # The harness names this tarball, and it no longer exists. gltest 0.29.2 asks for
      # genvm-universal.tar.xz; the release `latest` resolves to carries
      # genvm-runners-all.tar.xz, same 128.6 MB and same content, and the old name answers
      # 404 for every User-Agent. That is the whole cause of 93 failing tests with
      # "HTTP Error 404": not a cold cache, not a rate limit, a URL that was renamed
      # upstream.
      #
      # It is invisible locally by construction. A machine that fetched the tarball before
      # the rename still has it cached and never asks again, so the suite is green on this
      # machine because the cache predates the break rather than because the URL works.
      # Two wrong diagnoses got there first — a cold cache, then a User-Agent the CDN
      # rejects — and both were plausible enough to act on.
      - name: Cache the GenVM runner the direct harness needs
        uses: actions/cache@v4
        with:
          path: ~/.cache/gltest-direct
          key: genvm-${{ runner.os }}-${{ hashFiles('contracts/fideicommis.py') }}
          restore-keys: genvm-${{ runner.os }}-

      # Resolves the release version and the asset that carries the runners, because the
      # harness's name for it is not one this project can rely on. Asking the release
      # rather than hardcoding either spelling means a second rename is a clear message
      # here instead of 93 HTTP 404s later.
      - name: resolve the GenVM runner asset
        id: runner-check
        run: |
          python - <<'PY' > "$GITHUB_OUTPUT"
          import json, sys, urllib.request

          BROWSER = "Mozilla/5.0 (compatible; fideicommis-ci)"
          request = urllib.request.Request(
              "https://api.github.com/repos/genlayerlabs/genvm/releases/latest",
              headers={"User-Agent": BROWSER},
          )
          release = json.load(urllib.request.urlopen(request, timeout=60))
          # Prefer the name the harness asks for, fall back to the runners asset, so this
          # survives either side of a rename.
          universal = next(
              (a for a in release["assets"] if a["name"] == "genvm-universal.tar.xz"), None
          )
          runners = next(
              (
                  a
                  for a in release["assets"]
                  if "runners" in a["name"] and a["name"].endswith(".tar.xz")
              ),
              None,
          )
          chosen = universal or runners
          if chosen is None:
              raise SystemExit(
                  "no runners asset in this release: "
                  + ", ".join(a["name"] for a in release["assets"])
              )
          print(f"version={release['tag_name']}", file=sys.stdout)
          print(f"asset={chosen['name']}", file=sys.stdout)
          PY

      # States the diagnosis in the log, rather than leaving it in a commit message where
      # the next person to hit it will not look.
      - name: the runner asset the harness names is gone
        run: python check_runner_asset.py

      # Downloads it twice over: once under the release's own name, and once renamed to what
      # the harness looks for. The second file is the one that matters and the first was
      # not enough.
      #
      # The harness checks for `genvm-universal-{version}.tar.xz` and returns that path if
      # it exists — gltest/direct/sdk_loader.py, list_cached_versions() globs
      # `genvm-universal-*.tar.xz` and download_artifacts() returns early on a hit. So the
      # file has to carry that exact name, not merely be in the directory. Fetching it as
      # `genvm-runners-all.tar.xz` left the glob matching nothing, the harness fell through
      # to its own download of the URL that 404s, and the suite failed exactly as before.
      #
      # That is what the previous revision of this step got wrong: it put the asset in the
      # right directory under the wrong name, and read the step's success as the fetch
      # having worked.
      # Asserts the harness's own view. check_runner_cache.py reads gltest's source and calls
      # list_cached_versions() against a scratch directory, so a change in how gltest finds
      # a cached runner is caught here rather than 90 seconds later as 93 failures.
      - name: the harness will find the runner this fetched
        run: python check_runner_cache.py

      - name: fetch the runner under the name the harness expects
        run: |
          dir="$HOME/.cache/gltest-direct"
          mkdir -p "$dir"
          asset="${{ steps.runner-check.outputs.asset }}"
          version="${{ steps.runner-check.outputs.version }}"
          expected="$dir/genvm-universal-$version.tar.xz"
          if [ -f "$expected" ]; then
            echo "already cached as $(basename "$expected")"
          else
            url="https://github.com/genlayerlabs/genvm/releases/download/$version/$asset"
            echo "fetching $url"
            curl -fsSL --retry 3 -o "$expected" "$url"
            ls -la "$expected"
          fi
          # The harness reads this path and nothing else, so assert it rather than
          # trusting the download. A renamed file in the right directory is a pass that
          # does not mean anything.
          python - <<'PY'
          from pathlib import Path

          import gltest.direct.sdk_loader as sdk

          cached = sdk.list_cached_versions()
          if not cached:
              raise SystemExit(
                  f"the harness finds no cached runner: {sdk.list_cached_versions()=}, "
                  f"and it will download a URL that 404s"
              )
          print(f"the harness will use: {cached[0]}")
          for version in cached:
              path = sdk.CACHE_DIR / f"genvm-universal-{version}.tar.xz"
              print(f"  {path.name}  {path.stat().st_size / 1024 / 1024:.1f} MB")
          PY

      - name: genvm-lint (Fideicommis)
        run: genvm-lint check contracts/fideicommis.py

      - name: no floats in consensus
        run: python -m pytest tests/test_no_float.py -v

      - name: full direct-mode suite
        run: python -m pytest -v

      - name: studionet drivers parse
        run: for f in scripts/*.cjs; do node --check "$f"; done

  # The contract is the submission. The reader is checked too, but on its own
  # terms: it typechecks, builds, and refuses to leak chain code into a client
  # bundle. It is not run against a live node here, because a CI runner sharing
  # an IP would spend the public node's 30-reads-a-minute budget and every other
  # job would be throttled by its presence.
  reader:
    name: audit reader
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          # The repo is an npm workspace, so there is exactly one lockfile and it
          # lives at the root. Caching frontend/package-lock.json here silently fell
          # back to no cache the moment the workspace was introduced, and the
          # install ran un-cached rather than failing, which is the worse outcome.
          cache-dependency-path: package-lock.json

      # Install from the root, not from frontend/. Running npm ci inside a workspace
      # member installs only that member's own dependencies and skips the
      # hoisting that makes `next run build` work from here.
      - run: npm ci

      - name: typecheck
        run: npm run typecheck
        working-directory: frontend

      - name: build
        run: npm run build
        working-directory: frontend
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      # Both checks read from frontend/. They are the last two steps on purpose: the
      # bundle check is only meaningful once a build has produced .next.
      #
      # `server-only` is the mechanism that keeps the reader out of the browser, and
      # it is enforced by the compiler, not by this step. A client component that
      # imports frontend/src/lib/trust.ts fails the build outright, with the error
      # "You're importing a module that depends on server-only". That was verified by
      # writing exactly that component and watching the build fail.
      #
      # So the old check for `gen_call|createClient|genlayer-js` in a client chunk was
      # the wrong check, twice over. It failed on a bundle behaving as designed,
      # because actions.ts and wallet.ts are client modules that sign through the
      # user's own wallet and genuinely need the SDK. And it could not have caught the
      # leak it was named for, because the build stops before a bundle exists.
      #
      # What is left here is a check the compiler cannot make: that both server-only
      # modules still declare the marker. Deleting one line from a file would
      # otherwise turn a compile-time guarantee into a silent one, and that is exactly
      # the kind of change no test in this repository would otherwise notice.
      - name: server-only guard, and the local copy of these two checks
        run: |
          # The two reader checks below are bash because the runner is a Linux
          # container. check_bundle_guard.py is the same two checks in Python,
          # marked for contributors on Windows, where `bash` is not a shell that
          # exists. It is the file to run when changing either check.
          python check_bundle_guard.py

      - name: the server-only reader is marked server-only
        run: |
          for f in frontend/src/lib/genlayer.ts frontend/src/lib/trust.ts frontend/src/lib/featured.ts; do
            if ! grep -q '^import "server-only";' "$f"; then
              echo "::error::$f no longer imports server-only; the chain reader could be bundled into the browser"
              exit 1
            fi
          done
          echo "ok: both server-only modules still declare the marker"

      - name: the chain reader is imported only by server modules
        run: |
          # The compiler catches a direct client import. It does not catch a client
          # component importing a component that imports the reader, so the
          # transitive case is checked here: every file that reaches trust.ts or
          # genlayer.ts must itself be free of "use client".
          for f in $(grep -rlE '@/lib/(trust|genlayer|featured)|from "\./(trust|genlayer|featured)"' frontend/src); do
            if head -1 "$f" | grep -q "use client"; then
              echo "::error::$f is a client component and reaches the server-only chain reader"
              exit 1
            fi
          done
          echo "ok: no client component reaches the chain reader"

      # The layout is the kind of thing that regresses silently: a page still returns
      # 200 and still looks plausible, just narrow. This asserts the widths and the
      # gutter track are still in the built stylesheet, and that the two old cramped
      # values have not come back.
      # A README and a findings file that drift apart are worse than one document:
      # the reader has no way to tell which to believe. This asserts the figures the
      # two documents share against the contract itself, so a renamed method or a
      # changed hard limit fails here rather than in a reader's trust.
      # The write path reports the chain's own consensus output rather than a
      # summary, so it has to survive the shapes a receipt really arrives in. The
      # cases include a rolled-back deployment that happened on Studionet during
      # development, a split committee, and null.
      # A link that 404s is worse than no link: it looks like the project is making an
      # unverifiable claim and then sending you nowhere to check it. The routes were
      # confirmed against the live explorer; /transaction/ and /account/ both 404 there.
      - name: every explorer link is correct
        run: npx --yes tsx@4 tests/check_explorer.mts

      - name: equivalence evidence survives every receipt shape
        run: npx --yes tsx@4 tests/check_equivalence.ts

      

      # A page that reports a rejection for a transaction the node has never heard of
      # is the failure mode this project exists to avoid, and it is a rendering bug
      # rather than a parser bug, so it is checked where the verdicts are decided.
      - name: the transaction panel keeps its four verdicts apart
        run: npx --yes tsx@4 tests/check_tx_verdict.mts

      # Wallet discovery is invisible in a screenshot and wrong in four specific ways:
      # reading window.ethereum races between installed wallets, a hardcoded name list
      # hides every wallet not on it, a listener attached after the request loses
      # announcements, and a request sent only once never finds a wallet installed later.
      - name: every wallet is offered by name, and nothing is guessed
        run: npx --yes tsx@4 tests/check_wallet_discovery.mts

      # A write control that appears when the contract would refuse costs two minutes of
      # consensus to discover. The gating is a pure function beside the other pure
      # readers, so it is reachable without copying it out of the component, which is the
      # failure this project keeps closing.
      - name: no write is offered before the contract would accept it
        run: npx --yes tsx@4 tests/check_write_gating.mts

      # The read budget is derived from two numbers, and both used to live only in a
      # comment explaining the arithmetic. Adding six fixed views without editing the
      # comment left `FIXED_READS` at ten, so a page asked for 34 reads against the node's
      # 30-a-minute budget and the second tab of the same trust got throttled — which is
      # the exact failure the arithmetic exists to prevent. The check counts the views
      # actually sent and compares them to the constant.
      - name: the read budget is what the comment says it is
        run: npx --yes tsx@4 tests/check_read_budget.mts

      # A modal that does not fit renders perfectly at the viewport nobody tested on. This
      # one had a centred panel that clipped its own title and close button once it grew
      # past the viewport height, wallet names rendered as uppercase monospace because they
      # inherited the global button rule, and a long name overflowed a fixed-width panel
      # because a flex child defaults to min-width:auto. All three are invisible in a
      # screenshot at desktop width and all three are asserted here.
      - name: the wallet chooser fits at any viewport
        run: npx --yes tsx@4 tests/check_wallet_layout.mts

      # The mission-log entries are JSON documents inside JSON strings. The first version
      # of the panel compared an entry to the mission as text, which can never match, so it
      # reported drift on every trust including the ones that had drifted least. A warning
      # that always fires teaches a reader to ignore the only cross-view comparison in the
      # reader. The decoder was moved to lib/ so this imports the real function rather
      # than transcribing it out of a component.
      - name: the drift warning can only fire on real drift
        run: npx --yes tsx@4 tests/check_mission_log.mts

      # readTrust fills an unanswered view with an empty object rather than refusing to
      # render, which is right for the page and lethal for a panel that reads the hole as
      # data. Two of them did: `.toLocaleString()` on an undefined `total_shares` and
      # `.length` on an undefined `constitutional_kinds`. Found by loading a trust whose
      # constitution views did not answer, which is a state the reader is built to survive.
      # The substitute has to be the word "unreadable" and never a zero, because a zero on
      # a constitutional track is a claim about what a vote may not move.
      - name: an unreadable view shows as unreadable, not as a crash
        run: npx --yes tsx@4 tests/check_degraded_panels.mts

      # Negative caching is the one change here that could make the reader lie: a
      # remembered "this node has no record of it", replayed after the transaction
      # settled, would report an absence for something real. Three ways that could go
      # wrong are each broken on purpose, and each has to fail the check.
      # A test whose expectations are never compared passes whatever the code does. The
      # equivalence check used to carry an `expect` on every case and never look at it.
      # These break the parser and the cache four and three ways respectively, and each
      # one has to produce a different answer than the code would give unmutated.
      - name: the equivalence expectations can actually fail
        run: python mutate_check.py

      - name: the cache cannot hide a real failure
        run: python mutate_cache.py

      # Waits out the 30s rejection TTL on purpose, so it is not on the fast path.
      - name: the cache holds a value, an absence, and neither too long
        run: npx --yes tsx@4 tests/check_cache.mts

      # Every working-directory in every workflow, resolved against the filesystem.
      # The reader was renamed from web/ to frontend/ and three steps still named the
      # old directory. A step whose directory is gone fails, so those three had been
      # not running at all: typecheck, build, and the key-material guard. None of them
      # reports that; they just stop, which is the failure mode worth testing for.
      - name: every path CI depends on exists
        run: python check_ci_paths.py

      # Vercel reads vercel.json, not this project's docs, so the things that decide a
      # deployment are checked against that file: the build command names a script that
      # exists, the output directory is where the build writes, and the build succeeds
      # with no environment variables set at all — which is what a fresh Vercel project
      # looks like. It also asserts the reader reads no key material, since a deploy
      # target is the one place a key could plausibly get wired in by accident.
      - name: this repository builds the way Vercel will build it
        run: python check_deploy.py

      # Every URL this project fetches resolves. The direct harness asks
      # gltest for genvm-universal.tar.xz, which upstream renamed to
      # genvm-runners-all.tar.xz, and a machine whose cache predates the rename never
      # notices. This runs in both jobs so the break is a sentence rather than 93 failures
      # in whichever job happens to run the suite first.
      - name: every GenVM runner asset URL resolves
        run: python check_runner_asset.py

      # Every commit, and the next one, belongs to the repository owner. The authorship of
      # 30 commits was rewritten once and the git identity was never changed, so every
      # commit afterwards went back to a bot — and the contributors API stayed green
      # throughout, because it only counts what is already published. This asserts the
      # config, which is what stamps the next commit and is not in history at all.
      - name: every commit attributes to the repository owner
        run: python check_git_identity.py

      - name: the documents agree with the contract
        run: python check_docs.py

      # This needs something to measure. check_layout.py fetches the rendered pages over
      # HTTP, so a runner with no server answered "connection refused" and the step
      # failed — on a layout that is fine, and had never been checked on CI at all.
      #
      # It measures a production build rather than `next dev`, because that is what
      # Vercel serves and because dev renders differently enough to hide a width
      # regression. The build is already run above, so this only adds the server.
      - name: the layout uses the width it is given
        # An explicit background start rather than the check doing it. With the server as
        # a child, the check's own cleanup signalled the process group, and on a CI runner
        # that took the step down with it: "exit code 143", "the runner has received a
        # shutdown signal". Both times this ran on CI it died five seconds in, at the
        # point the server was being stopped, with no layout output at all.
        #
        # So the server is a sibling of the check rather than its child, and nothing the
        # check does can signal it. The trap at the end is belt and braces for a failure
        # path that exits before reaching the finally block.
        run: |
          cd frontend
          npx --yes next start --port 3000 &
          echo $! > /tmp/reader.pid
          cd ..
          for i in $(seq 1 60); do
            if curl -sf -o /dev/null http://127.0.0.1:3000/about; then break; fi
            sleep 1
          done
          python check_layout.py
          status=$?
          kill "$(cat /tmp/reader.pid)" 2>/dev/null || true
          exit $status

      - name: no key material in the app
        working-directory: frontend
        run: |
          # The wallet module legitimately talks about keys it does not hold, so
          # the rule is narrower than a bare grep: nothing may read key material
          # into the process. A hardcoded 64-hex literal is the thing to catch.
          if grep -rnE "0x[0-9a-fA-F]{64}" src/ --include="*.ts" --include="*.tsx"; then
            echo "::error::a 32-byte hex literal in the reader source could be key material"
            exit 1
          fi
          echo "ok: no 32-byte literal in the reader source"
